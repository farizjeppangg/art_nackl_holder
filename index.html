<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACKL Art Miner - Dragon Game</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .dragon-container {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #dragon-avatar {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        #dragon-avatar:active {
            transform: scale(0.92);
        }
        .stats-box {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:active {
            background-color: #006699;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐉 NACKL Dragon Miner</h1>
        
        <div class="dragon-container">
            <!-- Klik naga untuk menambang manual -->
            <div id="dragon-avatar" onclick="tapDragon()">🐲</div>
            <h2 id="dragon-name">Nacki Drago Lv. 1</h2>
            <p>Multiplier: <span id="multiplier">1x</span></p>
            <p>Energi: <span id="energy">100</span>/100</p>
        </div>

        <div class="stats-box">
            <p>Saldo NACKL: <span id="score">0</span></p>
            <p>Pendapatan / Detik (PPS): <span id="pps">1</span></p>
        </div>

        <button id="feed-btn" onclick="feedDragon()">Beri Makan Naga (Cost: <span id="feed-cost">50</span> NACKL)</button>
    </div>

    <!-- Menghubungkan ke file game.js -->
    <script src="game.js"></script>
</body>
</html>
